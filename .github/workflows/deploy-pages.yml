name: Deploy to GitHub Pages

# Builds a small static site (landing page + the interactive study dashboards)
# and publishes it to GitHub Pages. After making the repo public, enable Pages
# at Settings → Pages → Source: "GitHub Actions". It then redeploys on every push.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site
        run: |
          mkdir -p _site/trophic-structure
          cp site/index.html _site/index.html
          cp -r economics/trophic-structure/docs/. _site/trophic-structure/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
